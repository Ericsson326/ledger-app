<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>我的记账工具</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="主导航">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">¥</div>
          <div>
            <h1>我的记账</h1>
            <p id="todayLabel"></p>
          </div>
        </div>

        <nav class="nav-tabs" aria-label="视图切换">
          <button class="nav-tab active" data-view="records" type="button">流水</button>
          <button class="nav-tab" data-view="analytics" type="button">统计</button>
          <button class="nav-tab" data-view="settings" type="button">设置</button>
        </nav>
      </aside>

      <main>
        <section class="top-strip" aria-label="本月概览">
          <div class="metric">
            <span>本月收入</span>
            <strong id="monthIncome">¥0.00</strong>
          </div>
          <div class="metric">
            <span>本月支出</span>
            <strong id="monthExpense">¥0.00</strong>
          </div>
          <div class="metric">
            <span>本月结余</span>
            <strong id="monthBalance">¥0.00</strong>
          </div>
          <div class="metric compact">
            <span>记录数</span>
            <strong id="monthCount">0</strong>
          </div>
        </section>

        <section class="view active" id="recordsView">
          <div class="content-grid">
            <section class="panel entry-panel" aria-labelledby="entryTitle">
              <div class="panel-heading">
                <h2 id="entryTitle">新增流水</h2>
                <button class="ghost-button hidden" id="cancelEditBtn" type="button">取消编辑</button>
              </div>

              <form id="entryForm" class="entry-form">
                <input id="editingId" type="hidden" />

                <div class="segmented" role="group" aria-label="收支类型">
                  <label>
                    <input checked name="type" type="radio" value="expense" />
                    <span>支出</span>
                  </label>
                  <label>
                    <input name="type" type="radio" value="income" />
                    <span>收入</span>
                  </label>
                </div>

                <label class="field">
                  <span>金额</span>
                  <input id="amountInput" inputmode="decimal" min="0" placeholder="0.00" required step="0.01" type="number" />
                </label>

                <label class="field">
                  <span>日期</span>
                  <input id="dateInput" required type="date" />
                </label>

                <label class="field">
                  <span>分类</span>
                  <select id="categoryInput" required></select>
                </label>

                <label class="field">
                  <span>账户</span>
                  <select id="accountInput" required>
                    <option>现金</option>
                    <option>银行卡</option>
                    <option>信用卡</option>
                    <option>电子钱包</option>
                  </select>
                </label>

                <label class="field note-field">
                  <span>备注</span>
                  <input id="noteInput" maxlength="80" placeholder="可选" type="text" />
                </label>

                <button class="primary-button" id="submitBtn" type="submit">保存</button>
              </form>
            </section>

            <section class="panel ledger-panel" aria-labelledby="ledgerTitle">
              <div class="panel-heading">
                <h2 id="ledgerTitle">流水明细</h2>
                <button class="ghost-button" id="clearFiltersBtn" type="button">重置</button>
              </div>

              <div class="filters" aria-label="筛选">
                <label>
                  <span>月份</span>
                  <input id="monthFilter" type="month" />
                </label>
                <label>
                  <span>类型</span>
                  <select id="typeFilter">
                    <option value="all">全部</option>
                    <option value="expense">支出</option>
                    <option value="income">收入</option>
                  </select>
                </label>
                <label>
                  <span>分类</span>
                  <select id="categoryFilter">
                    <option value="all">全部</option>
                  </select>
                </label>
                <label>
                  <span>搜索</span>
                  <input id="searchInput" placeholder="备注、账户" type="search" />
                </label>
              </div>

              <div class="records-list" id="recordsList" aria-live="polite"></div>
            </section>
          </div>
        </section>

        <section class="view" id="analyticsView">
          <div class="analytics-grid">
            <section class="panel" aria-labelledby="categoryChartTitle">
              <div class="panel-heading">
                <h2 id="categoryChartTitle">支出分类</h2>
                <span class="subtle" id="categoryChartHint"></span>
              </div>
              <div class="chart-box">
                <canvas id="categoryChart" width="420" height="260"></canvas>
              </div>
              <div class="legend" id="categoryLegend"></div>
            </section>

            <section class="panel" aria-labelledby="trendChartTitle">
              <div class="panel-heading">
                <h2 id="trendChartTitle">收支趋势</h2>
                <span class="subtle" id="trendChartHint"></span>
              </div>
              <div class="chart-box">
                <canvas id="trendChart" width="640" height="260"></canvas>
              </div>
            </section>
          </div>
        </section>

        <section class="view" id="settingsView">
          <div class="settings-grid">
            <section class="panel" aria-labelledby="categoryTitle">
              <div class="panel-heading">
                <h2 id="categoryTitle">分类</h2>
              </div>

              <form id="categoryForm" class="inline-form">
                <select id="newCategoryType" aria-label="分类类型">
                  <option value="expense">支出</option>
                  <option value="income">收入</option>
                </select>
                <input id="newCategoryName" maxlength="12" placeholder="分类名称" required type="text" />
                <button class="primary-button" type="submit">添加</button>
              </form>

              <div class="category-columns">
                <div>
                  <h3>支出</h3>
                  <div class="chip-list" id="expenseCategoryList"></div>
                </div>
                <div>
                  <h3>收入</h3>
                  <div class="chip-list" id="incomeCategoryList"></div>
                </div>
              </div>
            </section>

            <section class="panel" aria-labelledby="dataTitle">
              <div class="panel-heading">
                <h2 id="dataTitle">数据</h2>
              </div>

              <div class="action-grid">
                <button class="secondary-button" id="exportCsvBtn" type="button">导出 CSV</button>
                <button class="secondary-button" id="exportJsonBtn" type="button">导出 JSON</button>
                <label class="file-button">
                  导入 JSON
                  <input id="importJsonInput" accept="application/json" type="file" />
                </label>
              </div>

              <label class="field">
                <span>货币</span>
                <select id="currencySelect">
                  <option value="CNY">CNY 人民币</option>
                  <option value="MYR">MYR 马来西亚林吉特</option>
                  <option value="USD">USD 美元</option>
                  <option value="SGD">SGD 新加坡元</option>
                  <option value="EUR">EUR 欧元</option>
                </select>
              </label>

              <button class="danger-button" id="clearDataBtn" type="button">清空所有数据</button>
            </section>
          </div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
<script src="./category-patch.js"></script>
<script src="./ui-patch.js"></script>
